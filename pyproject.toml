[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceiq"
version = "1.0.0"
description = "Application Windows locale d'analyse de la qualité des visages"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.10,<5", "numpy>=1.26,<3", "pillow>=10,<12", "PySide6>=6.8,<7"]

[project.scripts]
faceiq = "faceiq.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: validation sur des photographies réelles publiques"]
