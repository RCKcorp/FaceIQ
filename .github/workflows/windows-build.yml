name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Build executable
        run: pyinstaller --noconfirm --clean FaceIQ.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\FaceIQ.iss"
          if (-not (Test-Path "dist\installer\FaceIQ-Setup-1.0.0.exe")) {
            throw "Le setup Windows n'a pas été produit."
          }
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0"
          $setup = "dist\installer\FaceIQ-Setup-1.0.0.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $setup --clobber
          } else {
            git tag $tag
            git push origin $tag
            gh release create $tag $setup --title "FaceIQ 1.0.0" --generate-notes
          }
