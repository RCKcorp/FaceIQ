name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Build executable
        run: pyinstaller --noconfirm --clean FaceIQ.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FaceIQ-Windows
          path: dist/FaceIQ.exe
